```yaml
name: Alertas de mercado

on:
schedule:
- cron: "0 * * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
revisar:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

- uses: actions/setup-python@v5
with:
python-version: "3.12"

- name: Instalar dependencias
run: pip install yfinance pandas numpy requests

- name: Revisar el mercado y enviar alertas
run: python alertas.py --una-vez
env:
TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
SIMBOLOS: ${{ vars.SIMBOLOS }}
UMBRAL: ${{ vars.UMBRAL }}

- name: Guardar estado
run: |
git config user.name "alertas-bot"
git config user.email "alertas-bot@users.noreply.github.com"
git add estado_alertas.json || true
git diff --cached --quiet || (git commit -m "Actualizar estado de alertas" && git push)
```
